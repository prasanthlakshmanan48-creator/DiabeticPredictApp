services:
  # 1. Python Flask Backend REST API (Web Service)
  - type: web
    name: diabetic-predict-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.10.12

  # 2. React Frontend Web App (Static Site)
  - type: web
    name: diabetic-predict-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://diabeticpredictapp.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
