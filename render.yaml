services:
  # 1. Python Flask Backend REST API (Web Service)
  - type: web
    name: diabetic-predict-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.10.12

  # 2. React Frontend Web App (Static Site)
  - type: web
    name: diabetic-predict-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://diabeticpredictapp.onrender.com
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyBMyNWDC31ycEeBcmBbbNRZl4Cci1yd9ts
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: diabetes-prediction-app-7db47.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: diabetes-prediction-app-7db47
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: diabetes-prediction-app-7db47.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: 1010148864086
      - key: VITE_FIREBASE_APP_ID
        value: 1:1010148864086:web:3097581f80bb39808f4bf7
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
